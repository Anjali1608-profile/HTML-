<!DOCTYPE html>
<html>
<head>
<title>Student Registration with Validation</title>
<style>
form {
  width:400px; margin:auto; padding:20px; border:2px solid #555;
  border-radius:10px;
}
label { display:block; margin-top:10px; }
.error { color:red; }
</style>
</head>
<body>

<h2 align="center">Validated Registration Form</h2>

<form onsubmit="return validateForm()">
  <label>Roll Number:</label>
  <input type="text" id="roll">
  
  <label>Name:</label>
  <input type="text" id="name">
  
  <label>Date of Birth:</label>
  <input type="date" id="dob">
  
  <label>Gender:</label>
  <input type="radio" name="gender" value="Male">Male
  <input type="radio" name="gender" value="Female">Female
  
  <label>Course:</label>
  <select id="course">
    <option value="">Select</option>
    <option>B.Sc</option>
    <option>B.Com</option>
  </select>
  
  <br><br>
  <input type="submit" value="Submit">
</form>

<script>
function validateForm() {
  let roll = document.getElementById('roll').value;
  let name = document.getElementById('name').value;
  let dob = document.getElementById('dob').value;

  if(!/^\d{7}$/.test(roll)) {
    alert("Roll number must be a 7-digit numeric value");
    return false;
  }
  if(!/^[A-Za-z ]+$/.test(name)) {
    alert("Name should contain only alphabets");
    return false;
  }
  if(dob === "") {
    alert("Please enter your DOB");
    return false;
  }
  alert("Form submitted successfully!");
  return true;
}
</script>

</body>
</html>
