<!DOCTYPE html>
<html>
<head>
<title>HTML Formatting Example</title>
</head>
<body bgcolor="#f0f8ff" text="#000033">

<h1 style="color:blue; text-align:center;">HTML Formatting Example</h1>

<p><b>Bold text</b>, <i>Italic text</i>, <u>Underlined text</u></p>
<p style="color:red;">This text is in red color.</p>
<p style="font-family:Verdana; font-size:18px;">This is custom font and size.</p>
<p style="background-color:yellow;">This text has a yellow background.</p>

<hr>

<p>This is a paragraph with <br>line breaks <br>and horizontal line above.</p>

<p><marquee direction="left" scrollamount="5" bgcolor="lightgreen">This is marquee scrolling text!</marquee></p>

</body>
</html>
