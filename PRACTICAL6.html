<!DOCTYPE html>
<html>
<head>
<title>Department Page</title>
<style>
ul {
  list-style-type: none;
  background-color: #333;
  overflow: hidden;
}
li {
  float: left;
  position: relative;
}
li a {
  display: block;
  color: white;
  padding: 14px 16px;
  text-decoration: none;
}
li a:hover { background-color: #111; }
li ul {
  display: none;
  position: absolute;
  background-color: #444;
}
li:hover ul { display: block; }
li ul li { float: none; }
</style>
</head>

</html>
